name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow verifies, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test · typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # `npm test` runs node --experimental-strip-types, which needs 22+.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Each step runs even if an earlier one failed, so a single run reports
      # every problem rather than only the first.
      - name: Test
        if: '!cancelled()'
        run: npm test

      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      # The production build, not just dev — they fail independently here.
      - name: Build
        if: '!cancelled()'
        run: npm run build
